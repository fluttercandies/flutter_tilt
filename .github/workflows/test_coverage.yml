name: 'Test Coverage'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'example/**'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'example/**'

# Disable permissions for all of the available permissions
permissions: {}

env:
  tilt_sparse_checkout: |
    /*
    !/example/

jobs:
  code-analysis:
    name: "Code Analysis :: Flutter (latest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.tilt_sparse_checkout }}
          sparse-checkout-cone-mode: false
      - run: dir
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'
          cache: true
          pub-cache: false
      - name: Prepare dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Check Dart code formatting
        run: |
          dart format . -o none --set-exit-if-changed
      - name: Analyze Dart code
        run: |
          flutter analyze . --no-fatal-infos
      - name: Generate dartdoc
        run: |
          dart pub global activate dartdoc
          dart pub global run dartdoc .

  test:
    needs: [code-analysis]
    name: "Test :: Flutter (${{ matrix.flutter-version == '' && 'latest' || matrix.flutter-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter-version: ['3.19.0', '']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ${{ env.tilt_sparse_checkout }}
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
          pub-cache: false
      - name: Prepare dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Test
        run: flutter test

  upload-test-coverage:
    needs: [test]
    if: |
      github.repository == 'fluttercandies/flutter_tilt'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'
          cache: true
          pub-cache: false
      - name: Prepare dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Test Coverage
        run: flutter test --coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f #v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
